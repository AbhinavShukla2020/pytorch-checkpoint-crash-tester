[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-checkpoint-crash-tester"
version = "0.1.0"
description = "Failure injection and exact-resume checks for PyTorch DDP checkpoints"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
checkpoint-crash-train = "checkpoint_crash_tester.train:main"
checkpoint-crash-test = "checkpoint_crash_tester.harness:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: launches a real multi-process torchrun job"]

[tool.ruff]
line-length = 100
target-version = "py310"
